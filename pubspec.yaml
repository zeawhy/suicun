name: suicun
description: 随存 - 轻量个人信息库 (Lightweight personal information store)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.2

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2

  # File operations
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  archive: ^4.3.0

  # Icons
  cupertino_icons: ^2.0.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Test-only fakes (used directly by integration tests)
  path_provider_platform_interface: ^2.1.3

  # Code generation
  build_runner: ^2.4.15
  drift_dev: ^2.26.1
  riverpod_generator: ^4.0.9

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true  # enables l10n generation
