name: suicun
description: 随存 - 轻量个人信息库 (Lightweight personal information store)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.29

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2

  # File operations
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  archive: ^3.6.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.15
  drift_dev: ^2.26.1
  riverpod_generator: ^2.6.1

  # Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true  # enables l10n generation
