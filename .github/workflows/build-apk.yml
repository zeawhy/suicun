name: Build release (APK + AAB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Play upload keystore (optional)
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Play upload keystore prepared: release build will be signed with the upload key."
          else
            echo "No upload keystore secrets set: release build will fall back to debug signing."
          fi
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Build release AAB (Google Play)
        run: flutter build appbundle --release
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Verify versionCode
        run: |
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt -type f | head -1)
          APK_VERSION=$($AAPT dump badging build/app/outputs/flutter-apk/app-release.apk | grep -oP "versionCode='\K[0-9]+" || echo "0")
          echo "APK versionCode=$APK_VERSION, expected=${{ github.run_number }}"
          if [ "$APK_VERSION" != "${{ github.run_number }}" ]; then
            echo "::error::versionCode mismatch! APK has $APK_VERSION, expected ${{ github.run_number }}"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suicun-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: suicun-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
